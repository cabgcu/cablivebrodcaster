<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audience Screen · Canyon Night</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: none; }
  body.cursor { cursor: default; }
  #stage { position: fixed; inset: 0; }
  .layer {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: contain; opacity: 0; visibility: hidden; background: #000;
    transition: opacity var(--fade, 0ms) ease, visibility 0s linear var(--fade, 0ms);
  }
  .layer.on { opacity: 1; visibility: visible; z-index: 2; transition: opacity var(--fade, 0ms) ease, visibility 0s; }
  .layer.leaving { z-index: 1; }
  #start {
    position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; cursor: pointer; text-align: center;
    background: radial-gradient(70% 60% at 50% 35%, #2a170a 0%, #09090b 70%); color: #f6f6f7;
    font: 500 16px/1.5 "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }
  #start .mark { width: 72px; height: 72px; margin: 0 auto 22px; border-radius: 20px; display: grid; place-items: center;
    background: linear-gradient(145deg, #ffa24d, #ff5a1a 60%, #d93a0f); box-shadow: 0 12px 40px -8px rgba(255,106,26,.6); }
  #start .mark svg { width: 38px; height: 38px; stroke: #1a0a00; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  #start h1 { margin: 0; font-size: 44px; font-weight: 800; letter-spacing: -0.03em; }
  #start .go { display: inline-flex; align-items: center; gap: 10px; margin-top: 28px; height: 56px; padding: 0 28px;
    border-radius: 16px; background: #ff7a1a; color: #1a0a00; font-weight: 700; font-size: 17px; }
  #start p { margin: 14px 0 0; color: #b4b4bd; }
  #start .keys { margin-top: 40px; display: flex; gap: 18px; justify-content: center; flex-wrap: wrap; color: #74747f; font-size: 13.5px; }
  #start kbd { display: inline-grid; place-items: center; min-width: 26px; height: 26px; padding: 0 7px; margin-right: 6px;
    border-radius: 7px; background: #1c1c21; border: 1px solid rgba(255,255,255,.13); color: #f6f6f7; font: 600 12px "Inter", system-ui, sans-serif; }
  #hud {
    position: fixed; left: 12px; bottom: 12px; z-index: 9; color: #fff; opacity: 0;
    font: 500 13px "Inter", system-ui, sans-serif; background: rgba(0,0,0,.7); padding: 8px 12px; border-radius: 10px; backdrop-filter: blur(8px);
    transition: opacity .3s; pointer-events: none;
  }
  body.cursor #hud { opacity: 1; }
  #offline { position: fixed; top: 10px; right: 10px; width: 10px; height: 10px; border-radius: 50%;
    background: #e33; z-index: 9; display: none; }
  body.offline #offline { display: block; }
</style>
</head>
<body class="offline">
<div id="stage"></div>
<div id="offline" title="Not connected to show server"></div>
<div id="hud"></div>
<div id="start">
  <div>
    <div class="mark"><svg viewBox="0 0 24 24"><path d="M3 20 9.5 8l4 7 2.5-4L21 20Z"/><circle cx="17" cy="5" r="1.6"/></svg></div>
    <h1>Canyon Night Live</h1>
    <div class="go">Click to start the show screen</div>
    <p>Turns on sound and goes full screen.</p>
    <div class="keys">
      <span><kbd>→</kbd>Next</span><span><kbd>←</kbd>Back</span><span><kbd>B</kbd>Black</span><span><kbd>K</kbd>Play/pause</span><span><kbd>F</kbd>Full screen</span>
    </div>
  </div>
</div>

<script>
// If the page's code fails to load (often an old copy cached by the browser
// after an update), say so instead of leaving buttons that do nothing.
addEventListener('error', function (e) {
  if (document.getElementById('loadfail')) return;
  var d = document.createElement('div');
  d.id = 'loadfail';
  d.style.cssText = 'position:fixed;left:12px;right:12px;bottom:12px;z-index:99999;padding:14px 16px;border-radius:12px;background:#5c1111;color:#fff;font:15px/1.4 system-ui,sans-serif;box-shadow:0 8px 30px rgba(0,0,0,.5)';
  d.textContent = 'This page didn\u2019t load properly (' + (e.message || 'script error') + '). Tap here to reload.';
  d.onclick = function () { location.reload(); };
  (document.body || document.documentElement).appendChild(d);
});
</script>
<script type="module">
import { connect, CameraViewer, summarize, loadLibrary, loadSettings, saveSettings, DEFAULT_STATE, $, wakeLock } from './common.js';

const stage = $('#stage');
let library = { show: [], sounds: [] };
let state = structuredClone(DEFAULT_STATE);
let room = summarize([]);
const layers = new Map(); // key -> element. keys: 'show:<name>', 'cam:<id>'
let activeKey = null;
let lastTakeAt = null;

// ---------------- room ----------------
const link = connect('screen', {
  meta: { ready: false, cached: '' },
  onStatus: (up) => document.body.classList.toggle('offline', !up),
  onMessage: (m) => {
    if (m.t === 'cmd') command(m);
    else if (m.t === 'getstate') link.send({ t: 'state', to: m.from, state });
    else if (m.t === 'library') refreshLibrary();
    else if (m.t === 'signal') cams.handleSignal(m.from, m.data);
  },
  onPeers: (peers) => {
    room = summarize(peers);
    cams.sync(room.cameras);
    if (state.program.kind === 'camera' && !room.cameras.find((c) => c.id === state.program.id)) {
      state.program = { kind: 'black' }; // camera dropped while live: go to black, not a frozen frame
      changed();
    }
    render();
  },
  onPeerLeft: (id) => cams.drop(id, true),
});

// The screen is the source of truth for what's live. Apply commands from the iPads.
function take(index) {
  const item = library.show[index];
  if (item) state.program = { kind: 'show', index, name: item.name, at: Date.now() };
}
function command(m) {
  switch (m.action) {
    case 'take': take(m.index); break;
    case 'next': take(Math.min((state.program.kind === 'show' ? state.program.index : state.lastShowIndex ?? -1) + 1, library.show.length - 1)); break;
    case 'prev': take(Math.max((state.program.kind === 'show' ? state.program.index : state.lastShowIndex ?? 1) - 1, 0)); break;
    case 'black': state.program = { kind: 'black' }; break;
    case 'camera': if (room.cameras.find((c) => c.id === m.id)) state.program = { kind: 'camera', id: m.id }; break;
    case 'transition': state.transition = m.value === 'fade' ? 'fade' : 'cut'; break;
    case 'videoOpt': for (const k of ['volume', 'loop', 'autoplay', 'autoNext']) if (k in m) state.video[k] = m[k]; break;
    case 'master': state.master = Math.max(0, Math.min(1.5, Number(m.value))); break;
    case 'video': return videoOp(m.op, m.value);
    case 'sfx': return sfxOp(m.op, m.name);
    default: return;
  }
  changed();
}
let saveTimer;
function changed() {
  if (state.program.kind === 'show') state.lastShowIndex = state.program.index;
  render();
  link.send({ t: 'state', state });
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => saveSettings('live', state).catch(() => {}), 800);
}

// ---------------- cameras ----------------
const cams = new CameraViewer(link, {
  quality: 'high',
  onStream: (id, stream) => {
    const v = layerFor('cam:' + id, () => {
      const v = document.createElement('video');
      // No autoplay attribute: Chrome pauses hidden autoplay videos. We call play() ourselves.
      v.muted = true; v.playsInline = true;
      return v;
    });
    v.srcObject = stream;
    v.play().catch(() => {});
    render();
  },
  onGone: (id) => removeLayer('cam:' + id),
  onState: () => hud(),
});

// ---------------- layers ----------------
function layerFor(key, make) {
  let e = layers.get(key);
  if (!e) {
    e = make();
    e.classList.add('layer');
    e.dataset.key = key;
    stage.append(e);
    layers.set(key, e);
  }
  return e;
}
function removeLayer(key) {
  const e = layers.get(key);
  if (!e) return;
  if (e.tagName === 'VIDEO') { e.pause(); e.removeAttribute('src'); e.srcObject = null; }
  e.remove();
  layers.delete(key);
  if (activeKey === key) activeKey = null;
}

// Download every slide/video into memory so the show never waits on the internet.
const cache = new Map(); // url -> blob url
const loading = new Set();
async function cacheMedia(url) {
  if (cache.has(url) || loading.has(url)) return;
  loading.add(url);
  try {
    const r = await fetch(url);
    if (!r.ok) throw new Error(r.status);
    cache.set(url, URL.createObjectURL(await r.blob()));
  } catch (e) { console.warn('preload failed', url, e); }
  loading.delete(url);
  applyCache();
}
function applyCache() {
  let done = 0;
  for (const item of library.show) {
    const blob = cache.get(item.url);
    if (!blob) continue;
    done++;
    const e = layers.get('show:' + item.name);
    // Swap to the local copy, but never under a video that's on air.
    if (e && e.dataset.local !== blob && !(e.tagName === 'VIDEO' && e.classList.contains('on'))) {
      e.src = blob; e.dataset.local = blob;
    }
  }
  const cached = `${done}/${library.show.length}`;
  link.setMeta({ cached });
  hud();
}

async function refreshLibrary() {
  try { library = await loadLibrary(); }
  catch (e) { console.error(e); hudMsg = 'Can’t load media: ' + (e.message || e); hud(); return; }
  const keep = new Set();
  for (const item of library.show) {
    const key = 'show:' + item.name;
    keep.add(key);
    const e = layerFor(key, () => {
      if (item.type === 'video') {
        const v = document.createElement('video');
        v.preload = 'auto'; v.playsInline = true;
        v.addEventListener('ended', reportVideo);
        return v;
      }
      const img = new Image();
      img.decoding = 'async';
      return img;
    });
    if (e.dataset.url !== item.url) { e.dataset.url = item.url; e.dataset.local = ''; e.src = cache.get(item.url) || item.url; }
    cacheMedia(item.url);
  }
  for (const key of [...layers.keys()]) if (key.startsWith('show:') && !keep.has(key)) removeLayer(key);
  // Keep the live item pointing at the same file if the order changed.
  if (state.program.kind === 'show') {
    const i = library.show.findIndex((s) => s.name === state.program.name);
    if (i === -1) state.program = { kind: 'black' }; else state.program.index = i;
  }
  loadSounds(library.sounds);
  applyCache();
  changed();
}

function render() {
  const p = state.program;
  document.documentElement.style.setProperty('--fade', state.transition === 'fade' ? '600ms' : '0ms');
  let key = null;
  if (p.kind === 'show') key = 'show:' + p.name;
  else if (p.kind === 'camera') key = 'cam:' + p.id;

  for (const [k, e] of layers) {
    if (e.tagName === 'VIDEO' && k.startsWith('show:')) { e.volume = Math.min(1, state.video.volume); e.loop = state.video.loop; }
  }
  if (master) master.gain.value = state.master;

  const next = key && layers.get(key);
  const isNewTake = p.at && p.at !== lastTakeAt;
  lastTakeAt = p.at;

  if ((next ? key : null) !== activeKey || isNewTake) {
    const prev = activeKey && layers.get(activeKey);
    if (prev && prev !== next) {
      prev.classList.remove('on');
      prev.classList.add('leaving');
      setTimeout(() => {
        prev.classList.remove('leaving');
        if (prev.tagName === 'VIDEO' && !prev.srcObject && !prev.classList.contains('on')) prev.pause();
      }, state.transition === 'fade' ? 650 : 0);
    }
    if (next) {
      next.classList.add('on');
      if (next.tagName === 'VIDEO' && !next.srcObject && (isNewTake || prev !== next)) {
        next.currentTime = 0;
        if (state.video.autoplay && audioReady) next.play().catch(() => {});
      }
      // A camera feed must be playing when it goes on air, or it shows black.
      if (next.tagName === 'VIDEO' && next.srcObject) next.play().catch(() => {});
    }
    activeKey = next ? key : null;
    reportVideo();
  }
  hud();
}
let hudMsg = '';
function hud() {
  const p = state.program;
  $('#hud').textContent = (hudMsg ? hudMsg + ' · ' : '') +
    `media ${library.show.filter((i) => cache.has(i.url)).length}/${library.show.length} loaded · ` +
    (room.cameras.map((c) => `${c.name}: ${cams.states.get(c.id) || 'waiting'}`).join(', ') || '0 cameras') + ' · live: ' +
    (p.kind === 'show' ? p.name : p.kind === 'camera' ? (room.cameras.find((c) => c.id === p.id)?.name || 'camera') : 'black');
}

// ---------------- video transport ----------------
function liveVideo() {
  const e = activeKey && layers.get(activeKey);
  return e && e.tagName === 'VIDEO' && !e.srcObject ? e : null;
}
function videoOp(op, value) {
  const v = liveVideo();
  if (!v) return;
  if (op === 'play') v.play().catch(() => {});
  else if (op === 'pause') v.pause();
  else if (op === 'toggle') v.paused ? v.play().catch(() => {}) : v.pause();
  else if (op === 'restart') { v.currentTime = 0; v.play().catch(() => {}); }
  else if (op === 'seek') v.currentTime = Math.max(0, Math.min(v.duration || 0, Number(value)));
  else if (op === 'skip') v.currentTime = Math.max(0, Math.min(v.duration || 0, v.currentTime + Number(value)));
  reportVideo();
}
let lastReport = '';
function reportVideo() {
  const v = liveVideo();
  const msg = v
    ? { t: 'vstatus', name: state.program.name, time: Math.round(v.currentTime * 10) / 10, duration: v.duration || 0, paused: v.paused, ended: v.ended }
    : { t: 'vstatus', name: null };
  const sig = JSON.stringify(msg);
  if (sig === lastReport) return;
  lastReport = sig;
  link.send(msg);
  if (msg.ended && state.video.autoNext && !state.video.loop) command({ action: 'next' });
}
setInterval(reportVideo, 250);

// ---------------- soundboard (Web Audio, low latency) ----------------
let actx = null;
let master = null;
const buffers = new Map(); // url -> Promise<AudioBuffer>
const playing = new Map(); // name -> {src, gain, start, dur}
let soundList = [];

function ensureAudio() {
  if (!actx) {
    actx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' });
    master = actx.createGain();
    master.gain.value = state.master;
    master.connect(actx.destination);
  }
  return actx;
}
function loadSounds(list) {
  soundList = list;
  if (!actx) return;
  for (const s of list) {
    if (!buffers.has(s.url)) {
      buffers.set(s.url, fetch(s.url).then((r) => r.arrayBuffer()).then((b) => actx.decodeAudioData(b))
        .catch((e) => { console.warn('sound failed', s.name, e); buffers.delete(s.url); return null; }));
    }
  }
}
async function sfxOp(op, name) {
  if (!actx) return;
  if (op === 'stopAll') { for (const n of [...playing.keys()]) stopSound(n, 0.05); return; }
  if (op === 'fadeAll') { for (const n of [...playing.keys()]) stopSound(n, 1.5); return; }
  if (op === 'stop') return stopSound(name, 0.05);
  if (op === 'toggle' && playing.has(name)) return stopSound(name, 0.05);
  const s = soundList.find((x) => x.name === name);
  if (!s) return;
  const buf = await buffers.get(s.url);
  if (!buf) return;
  if (playing.has(name)) stopSound(name, 0.02);
  const src = actx.createBufferSource();
  src.buffer = buf;
  src.loop = !!s.loop;
  const gain = actx.createGain();
  gain.gain.value = s.vol ?? 1;
  src.connect(gain).connect(master);
  const entry = { src, gain, start: actx.currentTime, dur: buf.duration };
  src.onended = () => { if (playing.get(name) === entry) playing.delete(name); };
  playing.set(name, entry);
  src.start();
  sendSfx();
}
function stopSound(name, fade) {
  const e = playing.get(name);
  if (!e) return;
  playing.delete(name);
  const t = actx.currentTime;
  e.gain.gain.cancelScheduledValues(t);
  e.gain.gain.setValueAtTime(e.gain.gain.value, t);
  e.gain.gain.linearRampToValueAtTime(0, t + fade);
  e.src.stop(t + fade + 0.02);
  sendSfx();
}
let lastSfx = '';
function sendSfx() {
  if (!actx) return;
  for (const [name, e] of playing) {
    const s = soundList.find((x) => x.name === name);
    if (s) { e.gain.gain.value = s.vol; e.src.loop = !!s.loop; }
  }
  const list = [...playing].map(([name, e]) => {
    const t = actx.currentTime - e.start;
    return { name, pos: Math.round((e.src.loop ? t % e.dur : Math.min(t, e.dur)) * 10) / 10, dur: e.dur };
  });
  const sig = list.map((x) => x.name).join();
  if (list.length || sig !== lastSfx) link.send({ t: 'sfxstatus', playing: list });
  lastSfx = sig;
}
setInterval(sendSfx, 250);

// ---------------- start / unlock ----------------
let audioReady = false;
function start() {
  ensureAudio().resume();
  loadSounds(soundList);
  audioReady = true;
  $('#start').remove();
  link.setMeta({ ready: true });
  document.documentElement.requestFullscreen?.().catch(() => {});
  const v = liveVideo();
  if (v && v.paused && state.video.autoplay) v.play().catch(() => {});
}
$('#start').addEventListener('click', start);

// Laptop keyboard / presentation clicker backup controls
addEventListener('keydown', (e) => {
  if (!audioReady && (e.key === 'Enter' || e.key === ' ')) return start();
  const k = e.key;
  if (['ArrowRight', 'PageDown', ' ', 'ArrowDown'].includes(k)) { command({ action: 'next' }); e.preventDefault(); }
  else if (['ArrowLeft', 'PageUp', 'ArrowUp'].includes(k)) { command({ action: 'prev' }); e.preventDefault(); }
  else if (k === 'b' || k === 'B' || k === '.') command({ action: 'black' });
  else if (k === 'f' || k === 'F') document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
  else if (k === 'k' || k === 'K') videoOp('toggle');
});

let cursorTimer;
addEventListener('mousemove', () => {
  document.body.classList.add('cursor');
  clearTimeout(cursorTimer);
  cursorTimer = setTimeout(() => document.body.classList.remove('cursor'), 2000);
});
wakeLock();

// Restore what was on screen before a reload, then load media.
try {
  const saved = await loadSettings('live');
  state = { ...state, ...saved, video: { ...state.video, ...(saved.video || {}) } };
} catch (e) { console.warn('could not restore state', e); }
if (state.program.kind === 'camera') state.program = { kind: 'black' };
lastTakeAt = state.program.at; // don't auto-restart a video on reload
refreshLibrary();
</script>
</body>
</html>
