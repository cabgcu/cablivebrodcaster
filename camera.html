<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>Live Camera · Canyon Night</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="style.css">
<style>
  html, body { height: 100%; overflow: hidden; background: #000; }
  body { padding: 0; }
  #view { position: fixed; inset: 0; background: #000; }
  #view video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  #view::after { content: ""; position: absolute; inset: 0; pointer-events: none; border: 0 solid var(--live);
    transition: border-width .15s; z-index: 3; }
  #view.live::after { border-width: 6px; }
  .overlay { position: absolute; left: 0; right: 0; z-index: 2; display: flex; align-items: center; gap: 10px;
    padding: calc(env(safe-area-inset-top) + 14px) calc(env(safe-area-inset-right) + 16px) 28px calc(env(safe-area-inset-left) + 16px); }
  .overlay.top { top: 0; background: linear-gradient(rgba(0,0,0,.65), transparent); }
  .overlay.bottom { bottom: 0; padding: 28px calc(env(safe-area-inset-right) + 16px) calc(env(safe-area-inset-bottom) + 16px) calc(env(safe-area-inset-left) + 16px);
    background: linear-gradient(transparent, rgba(0,0,0,.65)); }
  .tally { display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 14px; border-radius: 99px;
    font-size: 13px; font-weight: 800; letter-spacing: .08em; background: rgba(255,255,255,.14); color: #fff;
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
  .tally::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,.6); }
  #view.live .tally { background: var(--live); box-shadow: 0 0 24px rgba(255,59,59,.6); }
  #view.live .tally::before { background: #fff; animation: blink 1.2s infinite; }
  .camname { font-weight: 700; font-size: 15px; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.5); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .overlay .pill { background: rgba(0,0,0,.35); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-color: rgba(255,255,255,.12); }
  .glass { --h: 52px; width: 52px; border-radius: 50%; background: rgba(255,255,255,.14); border: 0; color: #fff;
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
  .glass svg { width: 22px; height: 22px; }
  .hint { font-size: 12.5px; font-weight: 500; color: rgba(255,255,255,.7); }

  #setup { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: 20px;
    background: radial-gradient(120% 80% at 50% 0%, #1f140c 0%, var(--bg) 60%); overflow-y: auto; }
  #setup .card { width: min(420px, 100%); padding: 24px; display: grid; gap: 16px; }
  #setup h1 { margin: 6px 0 0; font-size: 24px; font-weight: 800; letter-spacing: -0.02em; }
  #setup p { margin: -8px 0 0; color: var(--text-3); font-size: 14px; }
  #setup .brand-mark { width: 44px; height: 44px; border-radius: 12px; }
  #setup .brand-mark svg { width: 24px; height: 24px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  #err { color: #ffb4b4; font-size: 14px; }
  #err:empty { display: none; }
</style>
</head>
<body>
<div id="view">
  <video id="preview" muted playsinline autoplay></video>
  <div class="overlay top">
    <span class="tally" id="tally">STANDBY</span>
    <span class="camname" id="camName"></span>
    <span class="spacer"></span>
    <span id="viewers" class="pill">0 viewers</span>
    <span id="conn" class="pill keep">Not joined</span>
  </div>
  <div class="overlay bottom">
    <span class="hint">Hold sideways · keep this page open</span>
    <span class="spacer"></span>
    <button class="btn glass" id="flip" title="Switch lens"><i data-icon="flip"></i></button>
    <button class="btn glass" id="settings" title="Camera settings"><i data-icon="sliders"></i></button>
  </div>
</div>

<div id="setup">
  <div class="card">
    <span class="brand-mark"><i data-icon="camera"></i></span>
    <h1>Join as a live camera</h1>
    <p>This phone will appear on the show controller, ready to cut to.</p>
    <label class="field">Camera name <input type="text" id="name" placeholder="e.g. Wide shot" autocomplete="off"></label>
    <div class="two">
      <label class="field">Lens
        <select id="facing"><option value="environment">Back</option><option value="user">Front</option></select>
      </label>
      <label class="field">Quality
        <select id="res"><option value="1080">1080p</option><option value="720" selected>720p</option><option value="540">540p</option></select>
      </label>
    </div>
    <button class="btn btn-lg btn-primary" id="go"><i data-icon="camera"></i>Start camera</button>
    <div class="muted" style="font-size:12.5px">720p is best for most Wi-Fi. Use 540p if the picture stutters.</div>
    <div id="err"></div>
  </div>
</div>

<script type="module">
import { connect, RTC_CONFIG, SignalQueue, addIce, setRemote, $, wakeLock } from './common.js';

const store = {
  get: (k, d) => { try { return localStorage.getItem(k) ?? d; } catch { return d; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch {} },
};
$('#name').value = store.get('camName', '');
$('#facing').value = store.get('camFacing', 'environment');
$('#res').value = store.get('camRes', '720');

let stream = null;
let link = null;
const pcs = new Map(); // viewerId -> {pc, quality}

async function getCamera() {
  const h = Number($('#res').value);
  const w = Math.round(h * 16 / 9);
  const s = await navigator.mediaDevices.getUserMedia({
    audio: false,
    video: { facingMode: $('#facing').value, width: { ideal: w }, height: { ideal: h }, frameRate: { ideal: 30, max: 30 } },
  });
  const t = s.getVideoTracks()[0];
  try { t.contentHint = 'motion'; } catch {}
  return s;
}

async function start() {
  $('#err').textContent = '';
  if (!navigator.mediaDevices?.getUserMedia) {
    $('#err').textContent = location.protocol !== 'https:'
      ? 'Camera needs a secure https:// page. Open the Live camera link from the start page.'
      : 'This browser can’t access the camera.';
    return;
  }
  try {
    // Release the old lens first: iPhones can't open two cameras at once.
    if (stream) stream.getTracks().forEach((t) => t.stop());
    stream = await getCamera();
  } catch (e) {
    $('#err').textContent = 'Could not open the camera: ' + (e.message || e.name) + '. Allow camera access and try again.';
    return;
  }
  $('#preview').srcObject = stream;
  $('#preview').style.transform = $('#facing').value === 'user' ? 'scaleX(-1)' : '';
  store.set('camName', $('#name').value); store.set('camFacing', $('#facing').value); store.set('camRes', $('#res').value);
  $('#setup').style.display = 'none';
  const name = $('#name').value.trim() || 'Phone camera';
  $('#camName').textContent = name;
  // Replace the track on every open connection (instant lens switch, no reconnect)
  const track = stream.getVideoTracks()[0];
  for (const { pc } of pcs.values()) for (const snd of pc.getSenders()) snd.replaceTrack(track);
  if (!link) {
    link = connect('camera', {
      meta: { name },
      onStatus: (up) => {
        $('#conn').className = 'pill keep ' + (up ? 'ok' : 'bad'); $('#conn').textContent = up ? 'Online' : 'Reconnecting…';
        if (up) link.send({ t: 'getstate' });
      },
      onMessage,
      onPeerLeft: closePc,
    });
    wakeLock();
  } else {
    link.setMeta({ name });
  }
}

function onMessage(m) {
  if (m.t === 'state') updateTally(m.state);
  else if (m.t === 'signal') onSignal(m.from, m.data);
}

function updateTally(s) {
  const live = s.program.kind === 'camera' && s.program.id === link.id;
  $('#view').classList.toggle('live', live);
  $('#tally').textContent = live ? 'ON AIR' : 'STANDBY';
  if (live) navigator.vibrate?.(60);
}

function preferH264(pc) {
  // Phones encode H.264 in hardware: lower latency and less heat.
  try {
    const caps = RTCRtpSender.getCapabilities('video').codecs;
    const h264 = caps.filter((c) => /h264/i.test(c.mimeType));
    const rest = caps.filter((c) => !/h264/i.test(c.mimeType));
    for (const tr of pc.getTransceivers()) tr.setCodecPreferences?.([...h264, ...rest]);
  } catch {}
}

async function tune(pc, quality) {
  for (const sender of pc.getSenders()) {
    const p = sender.getParameters();
    if (!p.encodings || !p.encodings.length) p.encodings = [{}];
    const e = p.encodings[0];
    if (quality === 'low') { e.scaleResolutionDownBy = 4; e.maxBitrate = 400_000; e.maxFramerate = 15; }
    else { e.scaleResolutionDownBy = 1; e.maxBitrate = 8_000_000; e.maxFramerate = 30; }
    p.degradationPreference = 'maintain-framerate';
    try { await sender.setParameters(p); } catch (err) { console.warn('setParameters', err); }
  }
}

const signals = new SignalQueue();
function onSignal(from, data) { return signals.run(from, () => handleSignal(from, data)); }
async function handleSignal(from, data) {
  if (data.type === 'want') {
    if (!stream) return;
    closePc(from);
    const pc = new RTCPeerConnection(RTC_CONFIG);
    pcs.set(from, { pc, quality: data.quality });
    for (const t of stream.getVideoTracks()) pc.addTrack(t, stream);
    preferH264(pc);
    pc.onicecandidate = (e) => e.candidate && link.send({ t: 'signal', to: from, data: { type: 'ice', candidate: e.candidate.toJSON() } });
    pc.onconnectionstatechange = () => {
      if (['failed', 'closed'].includes(pc.connectionState)) closePc(from);
      countViewers();
    };
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    // Send the offer right away, before any ICE candidates that setLocalDescription
    // just started gathering, so the viewer can use them.
    link.send({ t: 'signal', to: from, data: { type: 'offer', sdp: pc.localDescription.sdp } });
    tune(pc, data.quality);
  } else if (data.type === 'answer') {
    const e = pcs.get(from);
    if (e && e.pc.signalingState === 'have-local-offer') { await setRemote(e.pc, { type: 'answer', sdp: data.sdp }); tune(e.pc, e.quality); }
  } else if (data.type === 'ice') {
    const e = pcs.get(from);
    if (e) await addIce(e.pc, data.candidate);
  } else if (data.type === 'bye') {
    closePc(from);
  }
}

function closePc(id) {
  const e = pcs.get(id);
  if (!e) return;
  pcs.delete(id);
  e.pc.close();
  countViewers();
}
function countViewers() {
  const n = [...pcs.values()].filter((e) => e.pc.connectionState === 'connected').length;
  $('#viewers').textContent = `${n} viewer${n === 1 ? '' : 's'}`;
  $('#viewers').className = 'pill ' + (n ? 'ok' : '');
}

$('#go').onclick = start;
$('#settings').onclick = () => { $('#setup').style.display = ''; };
$('#flip').onclick = () => {
  $('#facing').value = $('#facing').value === 'user' ? 'environment' : 'user';
  start();
};

// If the phone comes back from the background, resume the preview.
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && stream) $('#preview').play().catch(() => {});
});
</script>
</body>
</html>
